[workspace]
members = ["crates/molt-cli", "crates/molt-index"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_ast_visit = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_span = "=0.154.0"
clap = { version = "4", features = ["derive"] }
graphql-parser = "=0.4.1"
tree-sitter = "=0.27.1"
tree-sitter-java = "=0.23.5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
